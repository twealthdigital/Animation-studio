<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globe character</title>
<style>
:root{--bg:#f3ece4;--panel:#fff;--ink:#2a1c14;--line:#d9c9b8;--accent:#e8702a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110e;--panel:#1f1914;--ink:#f1e4d6;--line:#3a2e25;--accent:#ff8a3d}}
:root[data-theme="dark"]{--bg:#15110e;--panel:#1f1914;--ink:#f1e4d6;--line:#3a2e25;--accent:#ff8a3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}
#stage{width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#120d0a;border:1px solid var(--line)}
#stage canvas{display:block;width:100%;height:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:#1b1612;border-color:var(--accent)}
input{flex:1;min-width:180px;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.label{font-size:.85rem;opacity:.75;margin-top:14px}
.hint{font-size:.85rem;opacity:.7;margin:8px 0 0}
</style>
</head>
<body>
<main>
<h1>Globe character</h1>
<div id="stage"></div>
<p class="hint">Drag to look around him, scroll to zoom.</p>

<div class="label">Talking</div>
<div class="row">
  <button id="talk">Start talking</button>
  <input id="line" value="Welcome to the show. Let me tell you what people are saying." aria-label="What the globe says">
  <button id="speak">Speak this</button>
</div>

<div class="label">Moods</div>
<div class="row" id="moods"></div>

<div class="label">Gestures</div>
<div class="row">
  <button data-act="nod">Nod</button>
  <button data-act="shake">Shake head</button>
  <button data-act="tilt">Curious tilt</button>
  <button data-act="hop">Hop</button>
  <button data-act="spin">Spin</button>
  <button data-act="flash">Flash antenna</button>
  <button data-act="blink">Blink</button>
  <button id="follow">Follow pointer</button>
  <button id="ringfast">Fast ring</button>
  <button id="reset">Reset angle</button>
  <button id="view">Zoom to face</button>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x120d0a);
const camera=new THREE.PerspectiveCamera(35,4/3,0.1,60);

// Camera orbit state (declared before the loop on purpose)
const orb={yaw:0,pitch:0.1,dist:11.5,ty:0.2},goal={dist:11.5,ty:0.2};

// Lights: warm key, orange rim from the right, teal fill from the left
scene.add(new THREE.AmbientLight(0x6b5a4c,0.95));
const key=new THREE.DirectionalLight(0xffd2a8,0.95);key.position.set(-2,3,5);scene.add(key);
const rim=new THREE.PointLight(0xff7a2a,1.5,14);rim.position.set(3.5,1,-1);scene.add(rim);
const fill=new THREE.PointLight(0x3fb8a8,0.55,14);fill.position.set(-3.5,0,3);scene.add(fill);

// ---------- Materials ----------
const M=(c)=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:0.8});
const orange=M(0xe8702a),orangeDk=M(0xc4521c),podL=M(0xb8452a),cream=M(0xf3ece4),
      dark=M(0x1a1512),steel=M(0xb9bcc0),stem=M(0xc23b22);

// ---------- Backdrop: studio wall with orange slats ----------
const slatA=M(0xb5571c),slatB=M(0xcf6f2b);
for(let i=-14;i<=14;i++){
  const s=new THREE.Mesh(new THREE.BoxGeometry(0.5,18,0.4),i%3===0?slatA:slatB);
  s.position.set(i*0.95,0,-5);scene.add(s);
}
const back=new THREE.Mesh(new THREE.PlaneGeometry(40,22),new THREE.MeshBasicMaterial({color:0x0d0907}));
back.position.z=-5.3;scene.add(back);

// ---------- Mic on a boom arm (left side) ----------
const mic=new THREE.Group();mic.position.set(-3.1,0.0,0.4);mic.rotation.z=0.32;scene.add(mic);
const micBody=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.17,1.0,8),dark);mic.add(micBody);
const micBand=new THREE.Mesh(new THREE.CylinderGeometry(0.215,0.215,0.07,8),orange);micBand.position.y=-0.1;mic.add(micBand);
const micHead=new THREE.Mesh(new THREE.IcosahedronGeometry(0.27,1),steel);micHead.position.y=0.6;mic.add(micHead);
const boom=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,3.5,6),dark);
boom.position.set(-4.1,2.2,0.3);boom.rotation.z=0.62;scene.add(boom);

// ---------- Floor shadow ----------
const shadow=new THREE.Mesh(new THREE.CircleGeometry(1.3,32),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.35}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=-2.6;scene.add(shadow);

// ---------- The character ----------
const bot=new THREE.Group();scene.add(bot);

// Shell
const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(1.4,1),orange);bot.add(shell);

// Face housing: a short drum that sits proud of the shell
const hg=new THREE.CylinderGeometry(1.18,1.22,0.85,32);hg.rotateX(Math.PI/2);
const housing=new THREE.Mesh(hg,orangeDk);housing.position.z=1.025;bot.add(housing);

// Screen with a live canvas texture
const fc=document.createElement('canvas');fc.width=fc.height=512;
const fg=fc.getContext('2d');
const faceTex=new THREE.CanvasTexture(fc);faceTex.anisotropy=4;
const screen=new THREE.Mesh(new THREE.CircleGeometry(1.0,48),new THREE.MeshBasicMaterial({map:faceTex}));
screen.position.z=1.455;bot.add(screen);
const bezel=new THREE.Mesh(new THREE.TorusGeometry(1.03,0.07,8,48),new THREE.MeshBasicMaterial({color:0xffc89a}));
bezel.position.z=1.455;bot.add(bezel);

// Ear pods
function makePod(x,mat){
  const g=new THREE.CylinderGeometry(0.34,0.34,0.32,8);g.rotateZ(Math.PI/2);
  const p=new THREE.Mesh(g,mat);p.position.set(x,0.05,0);bot.add(p);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.06,8),cream);
  cap.geometry.rotateZ(Math.PI/2);cap.position.set(x+Math.sign(x)*0.18,0.05,0);bot.add(cap);
}
makePod(-1.5,podL);makePod(1.5,orangeDk);

// Antenna with a glowing bulb
const antenna=new THREE.Group();antenna.position.set(0.1,1.3,0);bot.add(antenna);
const base=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.16,0.12,8),orangeDk);antenna.add(base);
const stemM=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.6,6),stem);stemM.position.y=0.35;antenna.add(stemM);
const bulbMat=new THREE.MeshBasicMaterial({color:0xc9a85a});
const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.15,10,8),bulbMat);bulb.position.y=0.74;antenna.add(bulb);

// Orbit ring with a little satellite
const ringTilt=new THREE.Group();ringTilt.rotation.set(1.2,0,0.25);bot.add(ringTilt);
const ringSpin=new THREE.Group();ringTilt.add(ringSpin);
const ringMesh=new THREE.Mesh(new THREE.TorusGeometry(2.15,0.03,6,96),new THREE.MeshBasicMaterial({color:0xf3ece4}));
ringSpin.add(ringMesh);
const sat=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,6),new THREE.MeshBasicMaterial({color:0xffe7a6}));
sat.position.x=2.15;ringSpin.add(sat);

// ---------- Face drawing ----------
const GLOW='#ffe7a6',BG='#0c0908';
function rr(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function drawEye(cx,cy,w,h,side,c){
  // lid line: tilt>0 makes the inner corner lower (angry), tilt<0 the outer corner (sad)
  const inner=-h/2+h*(c.cover+c.tilt*0.5),outer=-h/2+h*(c.cover-c.tilt*0.5);
  const a=side<0?outer:inner,b=side<0?inner:outer;
  const slope=(b-a)/w;
  const yAt=x=>a+slope*(x+w/2);
  fg.save();fg.translate(cx,cy);
  fg.beginPath();fg.moveTo(-w*2,yAt(-w*2));fg.lineTo(w*2,yAt(w*2));fg.lineTo(w*2,h*2);fg.lineTo(-w*2,h*2);fg.closePath();fg.clip();
  if(c.lower>0.01){
    const l=c.lower,ey=h/2-l*h*0.55;
    fg.beginPath();fg.moveTo(-w*2,-h*2);fg.lineTo(w*2,-h*2);fg.lineTo(w*2,ey);fg.lineTo(w*0.55,ey);
    fg.quadraticCurveTo(0,ey-l*h,-w*0.55,ey);fg.lineTo(-w*2,ey);fg.closePath();fg.clip();
  }
  fg.shadowColor=GLOW;fg.shadowBlur=28;fg.fillStyle=GLOW;
  rr(fg,-w/2,-h/2,w,h,w*0.32);fg.fill();
  fg.restore();
}
function drawMouth(t,c,amp){
  const N=13,sp=17;
  fg.save();fg.fillStyle=GLOW;fg.shadowColor=GLOW;fg.shadowBlur=18;
  for(let i=0;i<N;i++){
    const nx=(i-(N-1)/2)/((N-1)/2);
    const env=(1-c.env)+c.env*Math.sqrt(Math.max(0,1-nx*nx));
    let h=c.mh*(0.35+0.65*env)+amp*70*env*(0.5+0.5*Math.sin(t*19+i*1.9))*(0.55+0.45*Math.sin(t*6.1+i*0.7));
    h=Math.max(6,h);
    const yc=352-c.curve*30*nx*nx+c.curve*12;
    rr(fg,256+(i-(N-1)/2)*sp-3.5,yc-h/2,7,h,3.5);fg.fill();
  }
  fg.restore();
}
function drawFace(t,c,blinkAmt,lookX,lookY,amp){
  fg.fillStyle=BG;fg.fillRect(0,0,512,512);
  const h=c.eyeH*(1-blinkAmt*0.93);
  drawEye(256-88+lookX,212+lookY,c.eyeW,h,-1,c);
  drawEye(256+88+lookX,212+lookY,c.eyeW,h,1,c);
  drawMouth(t,c,amp);
  faceTex.needsUpdate=true;
}

// ---------- State ----------
const MOODS={
  neutral  :{eyeW:68,eyeH:80,cover:0.06,tilt:0,   lower:0,   curve:0,   mh:16,env:0.45},
  happy    :{eyeW:70,eyeH:64,cover:0,   tilt:0,   lower:0.5, curve:1,   mh:18,env:0.3},
  surprised:{eyeW:76,eyeH:108,cover:0,  tilt:0,   lower:0,   curve:0,   mh:52,env:1},
  angry    :{eyeW:68,eyeH:74,cover:0.16,tilt:0.75,lower:0,   curve:-0.4,mh:13,env:0.2},
  sad      :{eyeW:66,eyeH:78,cover:0.2, tilt:-0.85,lower:0,  curve:-1,  mh:12,env:0.35}
};
const cur={...MOODS.neutral};let target=MOODS.neutral;
let talking=false,talkLevel=0,speakUntil=0,follow=false,ringFast=false,ampS=0;
const ptr={x:0,y:0};
let blinkT=2,blink=0,last=0,ringAng=0;
const anims=[];
function play(dur,fn){anims.push({start:performance.now(),dur,fn});}

// ---------- Public API (the "functions") ----------
const botAPI={
  setMood(name){target=MOODS[name]||MOODS.neutral;},
  talk(on){talking=on;},
  speak(text){
    botAPI.talk(true);
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.pitch=1.4;u.rate=1.02;
      u.onboundary=()=>{talkLevel=1;};
      u.onend=u.onerror=()=>botAPI.talk(false);
      speechSynthesis.speak(u);
    }else{speakUntil=performance.now()+text.length*70;}
  },
  blink(){blink=1;},
  nod(){play(900,(p,o)=>{o.headX+=Math.sin(p*Math.PI*3)*0.2;});},
  shake(){play(1000,(p,o)=>{o.headY+=Math.sin(p*Math.PI*4)*0.35;});},
  tilt(){play(1300,(p,o)=>{const s=Math.sin(p*Math.PI);o.headZ+=s*0.32;o.headY+=s*0.2;});},
  hop(){play(900,(p,o)=>{o.hop+=Math.abs(Math.sin(p*Math.PI*2))*0.6;});},
  spin(){play(1400,(p,o)=>{o.spin+=(1-Math.cos(p*Math.PI))/2*Math.PI*2;});},
  flash(){play(1400,(p,o)=>{const s=Math.sin(p*Math.PI);o.flash+=s;o.ring+=s*3;});},
  ring(on){ringFast=on===undefined?!ringFast:on;},
  lookAt(x,y){ptr.x=x;ptr.y=y;}
};
window.globe=botAPI; // use globe.speak("..."), globe.hop() etc. in the console

// ---------- Animation loop ----------
function frame(now){
  const t=now/1000,dt=Math.min(0.05,last?(now-last)/1000:0.016);last=now;
  const o={headX:0,headY:0,headZ:0,hop:0,spin:0,flash:0,ring:0};
  for(let i=anims.length-1;i>=0;i--){
    const a=anims[i],p=(now-a.start)/a.dur;
    if(p>=1){anims.splice(i,1);continue;}
    a.fn(p,o);
  }
  // hover bob, sway and gesture offsets
  const hover=Math.sin(t*1.6)*0.08;
  bot.position.y=0.2+hover+o.hop;
  shadow.scale.setScalar(1-(hover+o.hop)*0.25);
  const fx=follow?ptr.y*0.3:0,fy=follow?ptr.x*0.5:0;
  bot.rotation.x+=((o.headX+fx+Math.sin(t*0.9)*0.02)-bot.rotation.x)*0.15;
  const baseY=bot.rotation.y-curSpin;
  curSpin=o.spin;
  bot.rotation.y=baseY+((o.headY+fy+Math.sin(t*0.4)*0.04)-baseY)*0.15+curSpin;
  bot.rotation.z=o.headZ+Math.sin(t*0.7)*0.02;
  // antenna: sway and glow
  antenna.rotation.z=Math.sin(t*1.3)*0.08-bot.rotation.z*0.5;
  const glow=0.35+0.2*Math.sin(t*2.4)+o.flash+(talking?0.3:0);
  bulbMat.color.setRGB(0.79+Math.min(glow,1)*0.21,0.66+Math.min(glow,1)*0.3,0.35+Math.min(glow,1)*0.5);
  bulb.scale.setScalar(1+o.flash*0.5);
  // ring orbit
  const rs=0.5+(ringFast?2.2:0)+o.ring;
  ringSpin.rotation.z+=dt*rs*1.4;
  ringTilt.rotation.y+=dt*rs*0.18;
  ringTilt.rotation.x=1.2+Math.sin(t*0.6)*0.08;
  // mood easing
  for(const k in target)cur[k]+=(target[k]-cur[k])*0.12;
  // blinking (delta time based)
  blinkT-=dt;if(blinkT<=0){blink=1;blinkT=2+Math.random()*3;}
  blink=Math.max(0,blink-dt*8);
  const blinkAmt=Math.sin(blink*Math.PI);
  // talking level
  if(speakUntil&&now>speakUntil){speakUntil=0;talking=false;}
  talkLevel*=0.9;
  const rawAmp=talking?Math.min(1,0.55+0.3*Math.sin(t*5)+talkLevel*0.4):0;
  ampS+=(rawAmp-ampS)*0.25;
  const lookX=follow?ptr.x*18:0,lookY=follow?ptr.y*12:0;
  drawFace(t,cur,blinkAmt,lookX,lookY,ampS);
  // camera
  orb.dist+=(goal.dist-orb.dist)*0.1;orb.ty+=(goal.ty-orb.ty)*0.1;
  const cp=Math.cos(orb.pitch);
  camera.position.set(Math.sin(orb.yaw)*cp*orb.dist,orb.ty+Math.sin(orb.pitch)*orb.dist,Math.cos(orb.yaw)*cp*orb.dist);
  camera.lookAt(0,orb.ty,0);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
let curSpin=0;

// ---------- UI wiring ----------
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const talkBtn=document.getElementById('talk');
talkBtn.onclick=()=>{talking=!talking;talkBtn.textContent=talking?'Stop talking':'Start talking';talkBtn.classList.toggle('on',talking);};
document.getElementById('speak').onclick=()=>botAPI.speak(document.getElementById('line').value);
const moods=document.getElementById('moods');
Object.keys(MOODS).forEach(m=>{const b=document.createElement('button');b.textContent=m[0].toUpperCase()+m.slice(1);
  b.onclick=()=>{botAPI.setMood(m);[...moods.children].forEach(c=>c.classList.toggle('on',c===b));};
  if(m==='neutral')b.classList.add('on');moods.appendChild(b);});
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>botAPI[b.dataset.act]());
const fb=document.getElementById('follow');
fb.onclick=()=>{follow=!follow;fb.classList.toggle('on',follow);if(!follow){ptr.x=ptr.y=0;}};
const rb=document.getElementById('ringfast');
rb.onclick=()=>{botAPI.ring();rb.classList.toggle('on',ringFast);};
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();
  ptr.x=((e.clientX-r.left)/r.width)*2-1;ptr.y=((e.clientY-r.top)/r.height)*2-1;});
const vb=document.getElementById('view');
let upper=false;
vb.onclick=()=>{upper=!upper;goal.dist=upper?6.5:11.5;goal.ty=upper?0.3:0.2;vb.textContent=upper?'Show full view':'Zoom to face';};
document.getElementById('reset').onclick=()=>{orb.yaw=0;orb.pitch=0.1;};
stage.style.touchAction='none';
let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointerup',()=>{drag=null;});
stage.addEventListener('pointermove',e=>{if(!drag)return;
  orb.yaw=Math.max(-1.2,Math.min(1.2,orb.yaw-(e.clientX-drag.x)*0.01));
  orb.pitch=Math.max(-0.3,Math.min(1.0,orb.pitch+(e.clientY-drag.y)*0.01));
  drag.x=e.clientX;drag.y=e.clientY;});
stage.addEventListener('wheel',e=>{e.preventDefault();goal.dist=Math.max(4,Math.min(18,goal.dist*(1+e.deltaY*0.001)));},{passive:false});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
