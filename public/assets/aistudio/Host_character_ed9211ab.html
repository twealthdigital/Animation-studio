<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Host character</title>
<style>
:root{--bg:#f3ece4;--panel:#fff;--ink:#2a1c14;--line:#d9c9b8;--accent:#e8702a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110e;--panel:#1f1914;--ink:#f1e4d6;--line:#3a2e25;--accent:#ff8a3d}}
:root[data-theme="dark"]{--bg:#15110e;--panel:#1f1914;--ink:#f1e4d6;--line:#3a2e25;--accent:#ff8a3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}
#stage{width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#1b1612;border:1px solid var(--line)}
#stage canvas{display:block;width:100%;height:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:#1b1612;border-color:var(--accent)}
input{flex:1;min-width:180px;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.label{font-size:.85rem;opacity:.75;margin-top:14px}
.hint{font-size:.85rem;opacity:.7;margin:8px 0 0}
</style>
</head>
<body>
<main>
<h1>Host character</h1>
<div id="stage"></div>
<p class="hint">Drag to rotate around him, scroll to zoom.</p>

<div class="label">Talking</div>
<div class="row">
  <button id="talk">Start talking</button>
  <input id="line" value="Welcome back to the show. Today we have a very special guest." aria-label="What the host says">
  <button id="speak">Speak this</button>
</div>

<div class="label">Moods</div>
<div class="row" id="moods"></div>

<div class="label">Gestures</div>
<div class="row">
  <button data-act="nod">Nod</button>
  <button data-act="shake">Shake head</button>
  <button data-act="wave">Wave</button>
  <button data-act="shrug">Shrug</button>
  <button data-act="point">Point</button>
  <button data-act="blink">Blink</button>
  <button id="follow">Follow pointer</button>
  <button id="walk">Start walking</button>
  <button id="reset">Reset angle</button>
  <button id="view">Zoom to upper body</button>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1b1612);
const camera=new THREE.PerspectiveCamera(35,4/3,0.1,50);
camera.position.set(0,1.6,11.5);camera.lookAt(0,0.3,0);

// Lights: warm orange rim from the right, cool fill from the left, like the studio
scene.add(new THREE.AmbientLight(0x6b5a4c,0.9));
const key=new THREE.DirectionalLight(0xffd2a8,0.9);key.position.set(-2,3,4);scene.add(key);
const rim=new THREE.PointLight(0xff7a2a,1.6,12);rim.position.set(3,1,-1);scene.add(rim);
const fill=new THREE.PointLight(0x3fb8a8,0.5,12);fill.position.set(-3,0,3);scene.add(fill);

// ---------- Materials ----------
const M=(c)=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:0.85});
const skin=M(0xb9703a),shirt=M(0x3f7f73),shirtDk=M(0x2f655b),hairM=M(0x2a1c14),
      white=new THREE.MeshBasicMaterial({color:0xfff4e6}),dark=new THREE.MeshBasicMaterial({color:0x1a0f0a});

// ---------- Build the character ----------
const guy=new THREE.Group();scene.add(guy);
guy.position.y=0.48;

// ---- extra materials ----
const black=M(0x141414),pants=M(0x262932),orange=M(0xe8702a),cream=M(0xf3ece4),seatM=M(0x2a211b);
const mouthM=new THREE.MeshBasicMaterial({color:0x3a0c0c});

// Shirt print: black base, orange piping, planet logo, teal hem
function shirtTexture(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#121212';g.fillRect(0,0,256,256);
  g.fillStyle='#f3ece4';g.fillRect(40,0,3,256);g.fillRect(50,0,3,256);g.fillRect(203,0,3,256);g.fillRect(213,0,3,256);g.fillRect(0,170,256,3);g.fillRect(0,180,256,3);
  g.fillStyle='#f3ece4';g.fillRect(0,236,256,3);g.fillRect(0,246,256,3);g.fillRect(0,12,256,3);g.fillRect(0,22,256,3);
  g.fillStyle='#e8702a';g.beginPath();g.arc(128,108,34,0,7);g.fill();
  g.fillStyle='#b8541c';g.beginPath();g.arc(140,98,9,0,7);g.fill();
  g.strokeStyle='#f3ece4';g.lineWidth=4;g.beginPath();g.ellipse(128,108,58,14,-0.35,0,7);g.stroke();
  g.fillStyle='#f3ece4';[[80,60],[182,66],[88,172],[172,178],[128,206]].forEach(p=>g.fillRect(p[0],p[1],4,4));
  g.strokeStyle='#f3ece4';g.lineWidth=3;g.beginPath();
  for(let i=0;i<=8;i++)g.lineTo(60+i*17,i%2?158:170);g.stroke();
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}
const shirtMat=new THREE.MeshStandardMaterial({map:shirtTexture(),flatShading:true,roughness:0.9});

// Torso: rectangular prism so the print sits on a flat front face
const tg=new THREE.CylinderGeometry(0.8,0.66,1.5,6);tg.rotateY(-Math.PI/6);
const torso=new THREE.Mesh(tg,[shirtMat,black,black]);
torso.scale.set(1,1,0.85);torso.position.y=0.2;guy.add(torso);
const collar=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.38,0.2,6),black);
collar.position.y=1.0;guy.add(collar);
const trim=new THREE.Mesh(new THREE.CylinderGeometry(0.39,0.39,0.04,6),orange);
trim.position.y=0.9;guy.add(trim);

// Neck + head
const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.24,0.3,6),skin);
neck.position.y=1.08;guy.add(neck);
const headPivot=new THREE.Group();headPivot.position.y=1.2;guy.add(headPivot);
const head=new THREE.Mesh(new THREE.IcosahedronGeometry(0.55,1),skin);
head.scale.set(0.95,1.1,0.95);head.position.y=0.55;headPivot.add(head);

// Hair
const hair=new THREE.Mesh(new THREE.IcosahedronGeometry(0.58,1),hairM);
hair.scale.set(1,0.75,1.02);hair.position.set(0,0.95,-0.06);headPivot.add(hair);
const quiff=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.22,0.5),hairM);
quiff.position.set(0,1.18,0.1);quiff.rotation.x=-0.25;headPivot.add(quiff);

// Beard: jaw shell sits below the mouth, plus mustache and sideburns
const beard=new THREE.Mesh(new THREE.SphereGeometry(0.57,10,6,0,Math.PI*2,Math.PI*0.66,Math.PI*0.34),hairM);
beard.scale.set(0.96,1.08,0.98);beard.position.set(0,0.55,0.02);headPivot.add(beard);
const stache=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.07,0.07),hairM);
stache.position.set(0,0.47,0.52);headPivot.add(stache);
[0.5,-0.5].forEach(x=>{const s=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.34,0.3),hairM);
  s.position.set(x,0.45,0.05);headPivot.add(s);});

// Eyes, brows, nose, mouth, ears
function makeEye(x){
  const g=new THREE.Group();g.position.set(x,0.68,0.5);
  const w=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,6),white);
  const p=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,6),dark);p.position.z=0.075;
  g.add(w,p);g.userData.pupil=p;headPivot.add(g);return g;
}
const eyeL=makeEye(0.2),eyeR=makeEye(-0.2);
function makeBrow(x){const b=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.05,0.05),hairM);
  b.position.set(x,0.86,0.5);headPivot.add(b);return b;}
const browL=makeBrow(0.2),browR=makeBrow(-0.2);
const nose=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.14,4),skin);
nose.rotation.x=Math.PI/2;nose.position.set(0,0.56,0.56);headPivot.add(nose);
const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.1,0.04),mouthM);
mouth.position.set(0,0.38,0.56);headPivot.add(mouth);
const teeth=new THREE.Mesh(new THREE.BoxGeometry(0.17,1,0.01),white);teeth.position.z=0.022;mouth.add(teeth);
const tongue=new THREE.Mesh(new THREE.BoxGeometry(0.12,1,0.01),new THREE.MeshBasicMaterial({color:0xc9485b}));tongue.position.z=0.021;mouth.add(tongue);
[0.54,-0.54].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.09,6,5),skin);
  e.position.set(x,0.58,0);headPivot.add(e);});

// Hand: palm, fingers, thumb (palm faces +z, the camera)
function makeHand(side){
  const h=new THREE.Group();h.position.y=-0.86;h.scale.setScalar(1.55);
  const palm=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.22,0.1),skin);palm.position.y=-0.1;
  const fing=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.18,0.08),skin);fing.position.set(0,-0.28,0.02);fing.rotation.x=0.2;
  const thumb=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.2,0.08),skin);
  thumb.position.set(0.17*side,-0.14,0.03);thumb.rotation.z=-0.35*side;
  h.add(palm,fing,thumb);return h;
}
// Arms: joint -> upper arm -> elbow -> forearm + orange cuff -> hand
function makeArm(side){
  const sh=new THREE.Group();sh.position.set(0.82*side,0.78,0);guy.add(sh);
  sh.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.2,1),black));
  const up=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.15,0.8,6),black);up.position.y=-0.4;sh.add(up);
  const el=new THREE.Group();el.position.y=-0.8;sh.add(el);
  el.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.15,0),black));
  const fo=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.12,0.75,6),black);fo.position.y=-0.375;el.add(fo);
  const cuff=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.07,6),orange);cuff.position.y=-0.74;el.add(cuff);
  const hand=makeHand(side);el.add(hand);
  return {sh,el,hand};
}
const armL=makeArm(1),armR=makeArm(-1); // armR = viewer's left, the waving arm

// Seat, hips and legs (seated: thigh forward, shin down)
// Floor disc with scrolling marks so walking in place reads as movement
const FLOOR_Y=-2.34;
const floor=new THREE.Mesh(new THREE.CircleGeometry(3.4,48),M(0x241c16));floor.rotation.x=-Math.PI/2;floor.position.y=FLOOR_Y;scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(3.3,3.4,48),new THREE.MeshBasicMaterial({color:0xe8702a}));ring.rotation.x=-Math.PI/2;ring.position.y=FLOOR_Y+0.01;scene.add(ring);
const stripes=[];for(let i=0;i<9;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(1,0.01,0.05),new THREE.MeshBasicMaterial({color:0x4a3a2e}));s.position.y=FLOOR_Y+0.01;scene.add(s);stripes.push(s);}
function updateFloor(ph){stripes.forEach((s,i)=>{const z=(((i*0.8-ph*0.9)%7.2)+7.2)%7.2-3.6;s.position.z=z;s.scale.x=2*Math.sqrt(Math.max(0,3.3*3.3-z*z))*0.98;});}
updateFloor(0);
let walking=false,walkAmt=0,phase=0;
const hips=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.4,0.9),pants);hips.position.y=-0.6;guy.add(hips);
function makeLeg(side){
  const hip=new THREE.Group();hip.position.set(0.4*side,-0.6,0.05);guy.add(hip);
  const th=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.3,1.0,6),pants);th.position.y=-0.5;hip.add(th);
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.9,0.05),orange);stripe.position.set(0.33*side,-0.5,0);hip.add(stripe);
  const knee=new THREE.Group();knee.position.y=-1.0;hip.add(knee);
  knee.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.3,0),pants));
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.24,0.95,6),pants);sh.position.y=-0.475;knee.add(sh);
  const shoe=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.22,0.72),orange);shoe.position.set(0,-1.04,0.16);knee.add(shoe);
  const sole=new THREE.Mesh(new THREE.BoxGeometry(0.48,0.07,0.74),cream);sole.position.set(0,-1.18,0.16);knee.add(sole);
  return {hip,knee};
}
const legL=makeLeg(1),legR=makeLeg(-1);

// ---------- State ----------
const MOODS={
  neutral :{brow:0,    browY:0,    eye:1,   mw:1,   mh:0.6, mrot:0},
  happy   :{brow:0.1,  browY:0.02, eye:0.8, mw:1.9, mh:0.9, mrot:0},
  surprised:{brow:0,   browY:0.09, eye:1.3, mw:0.8, mh:2.8, mrot:0},
  angry   :{brow:-0.45,browY:-0.03,eye:0.8, mw:1.1, mh:0.4, mrot:0},
  sad     :{brow:0.4,  browY:0.01, eye:0.9, mw:0.8, mh:0.4, mrot:0}
};
const cur={...MOODS.neutral};let target=MOODS.neutral;
let talking=false,talkLevel=0,speakUntil=0,follow=false;
const ptr={x:0,y:0};
let blinkT=2,blink=0;
const anims=[];

// ---------- Public API (the "functions") ----------
const guyAPI={
  setMood(name){target=MOODS[name]||MOODS.neutral;},
  talk(on){talking=on;},
  speak(text){
    guyAPI.talk(true);
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.onboundary=()=>{talkLevel=1;};
      u.onend=u.onerror=()=>guyAPI.talk(false);
      speechSynthesis.speak(u);
    }else{speakUntil=performance.now()+text.length*70;}
  },
  blink(){blink=1;},
  nod(){play(900,(p,o)=>{o.headX+=Math.sin(p*Math.PI*3)*0.22;});},
  shake(){play(1000,(p,o)=>{o.headY+=Math.sin(p*Math.PI*4)*0.35;});},
  wave(){play(2200,(p,o)=>{const up=Math.sin(Math.min(p*1.2,1)*Math.PI/2)*(p>0.85?1-(p-0.85)/0.15:1);
    o.rSz-=up*2.5;o.rSx-=up*0.5;o.rEz+=Math.sin(p*Math.PI*8)*0.6*up;o.rEx-=up*1.0;});},
  shrug(){play(1100,(p,o)=>{const s=Math.sin(p*Math.PI);o.shrug+=s*0.18;o.lSz+=s*0.5;o.rSz-=s*0.5;o.headZ+=s*0.1;});},
  point(){play(1600,(p,o)=>{const s=Math.sin(p*Math.PI);o.lSx-=s*1.35;o.lEx+=s*0.3;o.headY-=s*0.15;});},
  walk(on){walking=on===undefined?!walking:on;},
  lookAt(x,y){ptr.x=x;ptr.y=y;}
};
window.guy=guyAPI; // use guy.speak("..."), guy.wave() etc. in the console

function play(dur,fn){anims.push({start:performance.now(),dur,fn});}

// ---------- Animation loop ----------
function frame(now){
  const t=now/1000;
  const o={headX:0,headY:0,headZ:0,shrug:0,lSx:0,lSz:0,lEx:0,rSx:0,rSz:0,rEx:0,rEz:0};
  for(let i=anims.length-1;i>=0;i--){
    const a=anims[i],p=(now-a.start)/a.dur;
    if(p>=1){anims.splice(i,1);continue;}
    a.fn(p,o);
  }
  // idle: breathing + gentle sway
  torso.scale.y=1+Math.sin(t*1.8)*0.015;
  guy.rotation.y=Math.sin(t*0.4)*0.03*(1-walkAmt);
  // pointer follow
  const fx=follow?ptr.y*0.35:0, fy=follow?ptr.x*0.6:0;
  headPivot.rotation.x+=((o.headX+fx+Math.sin(t*0.9)*0.02)-headPivot.rotation.x)*0.2;
  headPivot.rotation.y+=((o.headY+fy)-headPivot.rotation.y)*0.2;
  headPivot.rotation.z=o.headZ+Math.sin(t*0.7)*0.015;
  headPivot.position.y=1.2+o.shrug;
  eyeL.userData.pupil.position.x=eyeR.userData.pupil.position.x=follow?ptr.x*0.03:0;
  // arms: resting pose is hands forward, like holding a desk
  walkAmt+=((walking?1:0)-walkAmt)*0.08;phase+=walkAmt*0.09;
  const ws=Math.sin(phase)*walkAmt;
  armL.sh.rotation.set(-0.12-ws*0.6+o.lSx,0,0.08+o.lSz);armL.el.rotation.set(-0.35-walkAmt*0.3+o.lEx,0,0);
  armR.sh.rotation.set(-0.12+ws*0.6+o.rSx,0,-0.08+o.rSz);armR.el.rotation.set(-0.35-walkAmt*0.3+o.rEx,0,o.rEz);
  armL.hand.rotation.x=-armL.el.rotation.x*0.85;armR.hand.rotation.x=-armR.el.rotation.x*0.85;
  legL.hip.rotation.x=ws*0.6;legR.hip.rotation.x=-ws*0.6;
  legL.knee.rotation.x=Math.max(0,-Math.cos(phase))*0.9*walkAmt;legR.knee.rotation.x=Math.max(0,Math.cos(phase))*0.9*walkAmt;
  guy.position.y=0.48+Math.abs(Math.sin(phase))*0.06*walkAmt;updateFloor(phase);
  // mood easing
  for(const k in target)cur[k]+=(target[k]-cur[k])*0.12;
  browL.rotation.z=-cur.brow;browR.rotation.z=cur.brow;
  browL.position.y=browR.position.y=0.86+cur.browY;
  // blinking
  blinkT-=1/60;if(blinkT<=0){blink=1;blinkT=2+Math.random()*3;}
  blink=Math.max(0,blink-0.14);
  const lid=cur.eye*(1-Math.sin(blink*Math.PI)*0.95);
  eyeL.scale.y=eyeR.scale.y=lid;
  // mouth: talking adds flapping on top of the mood's base shape
  if(speakUntil&&now>speakUntil){speakUntil=0;talking=false;}
  talkLevel*=0.9;
  const flap=talking?(0.5+0.5*Math.sin(t*16))*(0.6+0.4*Math.sin(t*5.3))+talkLevel*0.5:0;
  mouth.scale.set(cur.mw,cur.mh+flap*3.2,1);
  const ms=mouth.scale.y,H=0.1*ms,th=Math.min(0.035,H*0.4),tgh=Math.max(0,Math.min(0.06,(H-0.1)*0.6));
  teeth.scale.y=th/ms;teeth.position.y=(0.05*ms-th/2)/ms;
  tongue.scale.y=Math.max(tgh,0.0001)/ms;tongue.position.y=(-0.05*ms+tgh/2)/ms;
  orb.dist+=(goal.dist-orb.dist)*0.1;orb.ty+=(goal.ty-orb.ty)*0.1;
  const cp=Math.cos(orb.pitch);camera.position.set(Math.sin(orb.yaw)*cp*orb.dist,orb.ty+Math.sin(orb.pitch)*orb.dist,Math.cos(orb.yaw)*cp*orb.dist);camera.lookAt(0,orb.ty,0);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

// ---------- UI wiring ----------
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const talkBtn=document.getElementById('talk');
talkBtn.onclick=()=>{talking=!talking;talkBtn.textContent=talking?'Stop talking':'Start talking';talkBtn.classList.toggle('on',talking);};
document.getElementById('speak').onclick=()=>guyAPI.speak(document.getElementById('line').value);
const moods=document.getElementById('moods');
Object.keys(MOODS).forEach(m=>{const b=document.createElement('button');b.textContent=m[0].toUpperCase()+m.slice(1);
  b.onclick=()=>{guyAPI.setMood(m);[...moods.children].forEach(c=>c.classList.toggle('on',c===b));};
  if(m==='neutral')b.classList.add('on');moods.appendChild(b);});
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>guyAPI[b.dataset.act]());
const fb=document.getElementById('follow');
fb.onclick=()=>{follow=!follow;fb.classList.toggle('on',follow);if(!follow){ptr.x=ptr.y=0;}};
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();
  ptr.x=((e.clientX-r.left)/r.width)*2-1;ptr.y=((e.clientY-r.top)/r.height)*2-1;});
const vb=document.getElementById('view');
const orb={yaw:0,pitch:0.12,dist:11.5,ty:0.3},goal={dist:11.5,ty:0.3};
let upper=false;
vb.onclick=()=>{upper=!upper;goal.dist=upper?7:11.5;goal.ty=upper?1.6:0.3;vb.textContent=upper?'Show full body':'Zoom to upper body';};
document.getElementById('reset').onclick=()=>{orb.yaw=0;orb.pitch=0.12;};
const wb=document.getElementById('walk');
wb.onclick=()=>{guyAPI.walk();wb.textContent=walking?'Stop walking':'Start walking';wb.classList.toggle('on',walking);};
stage.style.touchAction='none';
let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointerup',()=>{drag=null;});
stage.addEventListener('pointermove',e=>{if(!drag)return;orb.yaw-=(e.clientX-drag.x)*0.01;orb.pitch=Math.max(-0.4,Math.min(1.2,orb.pitch+(e.clientY-drag.y)*0.01));drag.x=e.clientX;drag.y=e.clientY;});
stage.addEventListener('wheel',e=>{e.preventDefault();goal.dist=Math.max(4,Math.min(18,goal.dist*(1+e.deltaY*0.001)));},{passive:false});
requestAnimationFrame(frame);
})();
</script>
</body>
